name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  schedule:
    # Nightly full e2e run so the complete suite stays exercised even though
    # only the smoke project is a required check on PRs.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate: PRs cannot merge with TypeScript errors. This job is the
  # single source of truth for type safety and must be configured as a
  # required status check on the main/staging branch protection rules.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Verify pnpm lockfile is the only lockfile
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ] || [ -f npm-shrinkwrap.json ]; then
            echo "::error::Found a non-pnpm lockfile. This repo only tracks pnpm-lock.yaml."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Husky hooks are a local contributor convenience only. CI must never
      # depend on them, and a fresh clone without husky installed must not
      # fail. `HUSKY=0` disables hook installation so `prepare` is a no-op
      # even if husky is missing or misconfigured.
      - name: Typecheck
        run: pnpm run typecheck
        env:
          HUSKY: "0"

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Run unit/component tests
        run: pnpm test

  # Required fast check: only the curated critical-path specs (login, wallets,
  # wallet-send-receive) run in the `smoke` Playwright project. See
  # tests/e2e/README.md for the smoke vs full project split.
  e2e-smoke:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      # The specs drive a `pnpm run dev` server (see playwright.config.ts) and
      # only need Chromium. `--with-deps` pulls the OS libraries the browser
      # needs on the ubuntu runner.
      - name: Install Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      # NEXT_PUBLIC_API_URL is left empty on purpose: the specs run against the
      # in-repo mock `/api/*` routes so they need no live backend or secrets.
      - name: Run Playwright smoke project
        run: pnpm run test:e2e:smoke
        env:
          NEXT_PUBLIC_API_URL: ""

      # Upload Playwright traces, screenshots and the HTML report when the run
      # fails. Open traces locally with `pnpm exec playwright show-trace <zip>`.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-smoke
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Full suite: every spec under tests/e2e. Runs on the nightly schedule and on
  # demand, but is not a required PR check so it can't block unrelated work.
  e2e-full:
    name: E2E full suite (Playwright)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright full project
        run: pnpm run test:e2e:full
        env:
          NEXT_PUBLIC_API_URL: ""

      # Upload Playwright traces, screenshots and the HTML report when the run
      # fails. Open traces locally with `pnpm exec playwright show-trace <zip>`.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-full
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.network }})
    needs: [typecheck, unit-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `next build` type-checks and statically analyzes every route,
        # including the API routes that branch on NEXT_PUBLIC_API_URL
        # (see src/app/api/auth/login/route.ts and
        # src/lib/api/config.ts::getApiBaseUrl()). Building once with a
        # testnet-shaped URL and once with a mainnet-shaped URL catches
        # env-specific breakage before it reaches either environment.
        network: [testnet, mainnet]
        include:
          - network: testnet
            api_url: https://testnet-api.example.com
          - network: mainnet
            api_url: https://api.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ matrix.api_url }}
